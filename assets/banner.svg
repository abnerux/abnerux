<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Abner — criativo que programa">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1020"/><stop offset="1" stop-color="#1a1e33"/>
    </linearGradient>
    <radialGradient id="lilas" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8f78ff" stop-opacity=".75"/><stop offset="1" stop-color="#8f78ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="azul" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4f8dff" stop-opacity=".6"/><stop offset="1" stop-color="#4f8dff" stop-opacity="0"/></radialGradient>
    <radialGradient id="laranja" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff9a5a" stop-opacity=".45"/><stop offset="1" stop-color="#ff9a5a" stop-opacity="0"/></radialGradient>
    <linearGradient id="vidro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/><stop offset="1" stop-color="#ffffff" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="borda" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".08"/><stop offset="1" stop-color="#ffffff" stop-opacity=".25"/>
    </linearGradient>
    <radialGradient id="esfera" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#d9dcef"/><stop offset="1" stop-color="#8e93ad"/></radialGradient>
    <filter id="desfoque" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="cantos"><rect width="1200" height="320" rx="24"/></clipPath>
    <style>
      .b1 { animation: flutua1 14s ease-in-out infinite alternate; }
      .b2 { animation: flutua2 18s ease-in-out infinite alternate; }
      .b3 { animation: flutua1 22s ease-in-out infinite alternate-reverse; }
      @keyframes flutua1 { to { transform: translate(-60px, 30px); } }
      @keyframes flutua2 { to { transform: translate(70px, -25px); } }
      .orbita { animation: gira 24s linear infinite; transform-origin: 1004px 160px; }
      @keyframes gira { to { transform: rotate(360deg); } }
      .t { font-family: 'Segoe UI', 'SF Pro Display', Helvetica, Arial, sans-serif; }
    </style>
  </defs>
  <g clip-path="url(#cantos)">
    <rect width="1200" height="320" fill="url(#fundo)"/>
    <g filter="url(#desfoque)">
      <circle class="b1" cx="980" cy="40" r="190" fill="url(#lilas)"/>
      <circle class="b2" cx="160" cy="300" r="200" fill="url(#azul)"/>
      <circle class="b3" cx="1150" cy="300" r="150" fill="url(#laranja)"/>
    </g>
    <!-- estrelinhas -->
    <g fill="#fff" opacity=".55">
      <circle cx="80" cy="50" r="1.2"/><circle cx="300" cy="90" r="1"/><circle cx="520" cy="40" r="1.3"/><circle cx="690" cy="270" r="1"/>
      <circle cx="860" cy="60" r="1.1"/><circle cx="1110" cy="120" r="1.2"/><circle cx="420" cy="280" r="1"/><circle cx="760" cy="150" r=".9"/>
    </g>
    <!-- painel de vidro -->
    <rect x="48" y="44" width="760" height="232" rx="28" fill="url(#vidro)" stroke="url(#borda)" stroke-width="1.5"/>
    <text class="t" x="88" y="118" fill="#b8a6ff" font-size="20" font-weight="600" letter-spacing="3">OLÁ, EU SOU O</text>
    <text class="t" x="84" y="190" fill="#f6f8fd" font-size="72" font-weight="700" letter-spacing="-2">Abner</text>
    <text class="t" x="88" y="236" fill="#c9cde0" font-size="22">Criativo que programa · vídeo, foto e marketing → automações com IA</text>
    <!-- planeta do Attas -->
    <circle cx="1004" cy="160" r="96" fill="url(#vidro)" stroke="url(#borda)" stroke-width="1.5"/>
    <circle cx="1004" cy="160" r="46" fill="url(#esfera)"/>
    <g class="orbita">
      <ellipse cx="1004" cy="160" rx="78" ry="22" fill="none" stroke="#ffffff" stroke-opacity=".85" stroke-width="3" transform="rotate(-18 1004 160)"/>
      <circle cx="1078" cy="136" r="5" fill="#b8a6ff"/>
    </g>
  </g>
</svg>
